name: Deliver QazaqMetal 2.2.1 testing files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: milaniumkz/krug-club-prototype
    steps:
      - name: Verify and publish complete testing files
        run: |
          set -euo pipefail
          mkdir parts
          gh release download qazaqmetal-2.2.1-2026-11-18 --pattern 'v221.part.*' --dir parts
          test "$(find parts -type f | wc -l)" -eq 16
          cat parts/v221.part.??? > delivery.zip
          echo '0ca0b851c86d17ef4b71adf8e39f0e9ea7aeddc40f1dc67234bcaabb4fd09d9d  delivery.zip' | sha256sum --check
          unzip -q delivery.zip
          sha256sum --check checksums.sha256
          gh release upload qazaqmetal-2.2.1-2026-11-18 QazaqMetal_full_project.zip QazaqMetal_Android_server.apk QazaqMetal_demo_assets.zip checksums.sha256 --clobber
