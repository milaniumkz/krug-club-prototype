# Copy to .github/workflows/qazaqmetal-platform.yml when connecting CI.
name: QazaqMetal quality
on:
  push:
    paths: ['platform/**', '.github/workflows/qazaqmetal-platform.yml']
  pull_request:
    paths: ['platform/**']
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qazaqmetal
          POSTGRES_PASSWORD: ci-only-not-for-production
          POSTGRES_DB: qazaqmetal_test
        ports: ['5432:5432']
        options: --health-cmd='pg_isready -U qazaqmetal -d qazaqmetal_test' --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://qazaqmetal:ci-only-not-for-production@127.0.0.1:5432/qazaqmetal_test
      TEST_DATABASE_URL: postgresql+psycopg://qazaqmetal:ci-only-not-for-production@127.0.0.1:5432/qazaqmetal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r platform/server/requirements.lock
      - run: cd platform/server && alembic upgrade head && python -m pytest -q && alembic check && ruff check app
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: cd platform/client && flutter pub get --enforce-lockfile && flutter analyze && flutter test && flutter build web --release --no-web-resources-cdn --no-wasm-dry-run
  ios:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: flutter config --no-enable-swift-package-manager
      - run: cd platform/client && flutter pub get --enforce-lockfile && flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://build-only.invalid
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-unsigned-build
          path: platform/client/build/ios/iphoneos/Runner.app
      - name: Deliver unsigned iOS validation build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: milaniumkz/krug-club-prototype
        run: |
          ditto -c -k --sequesterRsrc --keepParent platform/client/build/ios/iphoneos/Runner.app iOS-unsigned.zip
          gh release upload qazaqmetal-platform-2026-11-14 iOS-unsigned.zip --clobber
