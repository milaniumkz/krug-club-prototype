name: Prepare isolated QMET+ store review accounts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qazaqmetal-production-deploy
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install paramiko==4.0.0
      - name: Create isolated review fixtures without exposing credentials
        env:
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          STORE_REVIEW_CREDENTIALS: ${{ secrets.STORE_REVIEW_CREDENTIALS }}
        run: python .github/scripts/publish_legal.py --review-accounts
