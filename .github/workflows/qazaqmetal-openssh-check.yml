name: Verify SSH login with standard OpenSSH client
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install standard SSH password helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify pinned server key and attempt one standard SSH login
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh-keyscan -T 10 -t ed25519 109.235.119.144 > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          actual=$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}')
          test "$actual" = 'SHA256:Bt3HkaktjLmWe4tB1pOK9b8gOnHuxp+tvp1hhEDtxp8'
          echo 'Server identity verified. Testing OpenSSH without changing server settings.'
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 root@109.235.119.144 'id; uname -a'
