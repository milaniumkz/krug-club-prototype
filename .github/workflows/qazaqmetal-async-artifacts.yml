name: Deliver QazaqMetal 2.2.1 testing files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: milaniumkz/krug-club-prototype
    steps:
      - name: Verify and publish complete testing files
        run: |
          set -euo pipefail
          mkdir parts
          gh release download qazaqmetal-async-2026-11-18 --pattern 'async.part.*' --dir parts
          test "$(find parts -type f | wc -l)" -eq 3
          cat parts/async.part.??? > delivery.zip
          echo 'e2da87c41ea763991e1c26cebdb412f944dfef16dfedde9ca5a4817d6afc0031  delivery.zip' | sha256sum --check
          unzip -q delivery.zip
          sha256sum --check checksums.sha256
          gh release upload qazaqmetal-async-2026-11-18 QazaqMetal_full_project.zip checksums.sha256 --clobber
