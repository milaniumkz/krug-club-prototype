name: Deliver QazaqMetal 2.2 testing files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: milaniumkz/krug-club-prototype
    steps:
      - name: Verify and publish complete testing files
        run: |
          set -euo pipefail
          mkdir parts
          gh release download qazaqmetal-testing-2026-11-18 --pattern 'v22.part.*' --dir parts
          test "$(find parts -type f | wc -l)" -eq 16
          cat parts/v22.part.??? > delivery.zip
          echo 'ef1732b6ec502686c8178363a8a0a8507604e816cae3911684e072c85d78766f  delivery.zip' | sha256sum --check
          unzip -q delivery.zip
          sha256sum --check checksums.sha256
          gh release upload qazaqmetal-testing-2026-11-18 QazaqMetal_full_project.zip QazaqMetal_Android_server.apk QazaqMetal_demo_assets.zip checksums.sha256 --clobber
