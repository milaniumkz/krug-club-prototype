name: Deliver QazaqMetal 2.3.1 Firebase push files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: milaniumkz/krug-club-prototype
    steps:
      - name: Verify and publish complete testing files
        run: |
          set -euo pipefail
          mkdir parts
          gh release download qazaqmetal-2.3.1-2026-11-20 --pattern 'v231.part.*' --dir parts
          test "$(find parts -type f | wc -l)" -eq 28
          cat parts/v231.part.??? > delivery.zip
          echo 'e39b11fef27c698f262d375c11ded3099edbb079339172676c49cf9a49921451  delivery.zip' | sha256sum --check
          unzip -q delivery.zip
          sha256sum --check checksums.sha256
          gh release upload qazaqmetal-2.3.1-2026-11-20 QazaqMetal_full_project.zip QazaqMetal_Android_server.apk QazaqMetal_Partner_debug.apk QazaqMetal_demo_assets.zip checksums.sha256 --clobber
