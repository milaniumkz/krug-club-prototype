name: Measure authorized staged read-only server capacity
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: full
        options: [full, stability]
      stability_rate:
        type: string
        default: '200'
      stability_seconds:
        type: string
        default: '300'
permissions:
  contents: read
concurrency:
  group: qazaqmetal-production-deploy
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq wrk
      - run: pip install paramiko==4.0.0 httpx==0.28.1 aiohttp==3.13.2
      - name: Measure bounded stages with automatic stop thresholds
        env:
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          QM_LOAD_MODE: ${{ inputs.mode || 'full' }}
          QM_STABILITY_RATE: ${{ inputs.stability_rate || '200' }}
          QM_STABILITY_SECONDS: ${{ inputs.stability_seconds || '300' }}
        run: python .github/scripts/load_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qazaqmetal-load-verification
          path: load-verification/
