name: Deliver QazaqMetal 2.4.1 member card and employee import files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: milaniumkz/krug-club-prototype
    steps:
      - name: Verify and publish complete testing files
        run: |
          set -euo pipefail
          mkdir parts
          gh release download qmetplus-2.4.1-2026-11-25 --pattern 'qmet241web.part.*' --dir parts
          test "$(find parts -type f | wc -l)" -eq 3
          cat parts/qmet241web.part.??? > delivery.zip
          echo 'fac2cbccfc400422a02751f752765f2424d59b829a7e5bdf576314ff8f3789e1  delivery.zip' | sha256sum --check
          unzip -q delivery.zip
          sha256sum --check --ignore-missing checksums.sha256
          gh release upload qmetplus-2.4.1-2026-11-25 QMETplus_full_project.zip checksums.sha256 --clobber
