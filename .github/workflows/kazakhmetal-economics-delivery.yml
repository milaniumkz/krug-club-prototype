name: Deliver updated KazakhMetal presentation and economics
on:
  push:
    branches: [qazaqmetal-latin-delivery-20261112]
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: milaniumkz/krug-club-prototype
    steps:
      - name: Reassemble and verify the original deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir parts
          gh release download qazaqmetal-latin-2026-11-12 --pattern 'delivery.zip.part.*' --dir parts
          test "$(find parts -type f | wc -l)" -eq 10
          cat parts/delivery.zip.part.??? > delivery.zip
          echo 'a27719db12a9415bf8acfc0912ccf01ef3c381b16070cd01f44df9d5694453dd  delivery.zip' | sha256sum --check
          unzip -q delivery.zip
          sha256sum --check checksums.sha256
          gh release upload qazaqmetal-latin-2026-11-12 QazaqMetal_Kasipodagy_FullHD.mp4 KazakhMetal_editable.pdf KazakhMetal_editable.pptx KazakhMetal_calculations.xlsx
