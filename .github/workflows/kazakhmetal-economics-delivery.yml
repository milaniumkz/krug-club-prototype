name: Deliver updated KazakhMetal presentation and economics
on:
  push:
    branches: [qazaqmetal-10000-delivery-20261112]
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: milaniumkz/krug-club-prototype
    steps:
      - name: Reassemble and verify the original deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir parts
          gh release download qazaqmetal-10000-2026-11-12 --pattern 'delivery.zip.part.*' --dir parts
          test "$(find parts -type f | wc -l)" -eq 10
          cat parts/delivery.zip.part.??? > delivery.zip
          echo '7e4fc3649f74b3f202b80d96cae996080ea03e6b74d03e94ea9ba0f3d8688ff7  delivery.zip' | sha256sum --check
          unzip -q delivery.zip
          sha256sum --check checksums.sha256
          gh release upload qazaqmetal-10000-2026-11-12 QazaqMetal_Kasipodagy_FullHD.mp4 KazakhMetal_editable.pdf KazakhMetal_editable.pptx KazakhMetal_calculations.xlsx
