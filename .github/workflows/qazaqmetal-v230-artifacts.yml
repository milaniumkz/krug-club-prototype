name: Deliver QazaqMetal 2.2.1 testing files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: milaniumkz/krug-club-prototype
    steps:
      - name: Verify and publish complete testing files
        run: |
          set -euo pipefail
          mkdir parts
          gh release download qazaqmetal-2.3.0-2026-11-19 --pattern 'v230.part.*' --dir parts
          test "$(find parts -type f | wc -l)" -eq 28
          cat parts/v230.part.??? > delivery.zip
          echo 'ce6e517d6236d843023f3bdd1dcdd219ae222a7c832bfe77774633cffdcbb43c  delivery.zip' | sha256sum --check
          unzip -q delivery.zip
          sha256sum --check checksums.sha256
          gh release upload qazaqmetal-2.3.0-2026-11-19 QazaqMetal_full_project.zip QazaqMetal_Android_server.apk QazaqMetal_Partner_debug.apk QazaqMetal_demo_assets.zip checksums.sha256 --clobber
