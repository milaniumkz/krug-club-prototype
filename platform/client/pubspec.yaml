name: qazaqmetal
description: QMET+ member and partner platform
publish_to: none
version: 2.4.0+20
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  vector_map_tiles: ^8.0.0
  crypto: ^3.0.7
  local_auth: ^3.0.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  uuid: ^4.5.1
  image_picker: ^1.2.0
  file_selector: ^1.0.4
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.1
  package_info_plus: ^9.0.0
  firebase_core: 4.0.0
  firebase_messaging: 16.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/Manrope.ttf
    - family: PTSerif
      fonts:
        - asset: assets/PTSerif-Regular.ttf
        - asset: assets/PTSerif-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/Roboto.ttf
